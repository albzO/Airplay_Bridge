[package]
name = "airplay-bridge-gpui"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
airplay-desktop = { path = "../../airplay-desktop" }
homepod-test = { path = "../../airplay-core" }
anyhow = "1"
async-channel = "2"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "=0.25.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }

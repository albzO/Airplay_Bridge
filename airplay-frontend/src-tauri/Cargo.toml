[package]
name = "airplay-bridge"
version = "1.0.3"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
airplay-desktop = { path = "../../airplay-desktop" }
homepod-test = { path = "../../airplay-core" }

[profile.release]
strip = true
lto = "thin"

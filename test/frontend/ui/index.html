<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mockIPC } from '@tauri-apps/api/mocks';
      import { emit } from '@tauri-apps/api/event';
      import devices from '../fixtures/devices.json';
      import inputs from '../fixtures/inputs.json';
      import metadata from '../../../airplay-frontend/package.json';
      let id = 100;
      // 定时回调绑定发起时的编号，不能把旧回调伪装成新会话事件。
      // Bind timers to their originating id rather than relabeling old callbacks as the new session.
      const send = (sessionId, payload) =>
        emit('stream-event', { session_id: sessionId, ...payload });
      mockIPC(
        (cmd, args) => {
          if (cmd === 'plugin:app|version') return metadata.version;
          if (cmd === 'set_capture_enabled') {
            emit('source-level', {
              endpoint: inputs[0].id,
              captureEnabled: args.enabled,
              peaks: [0, 0],
            });
            return;
          }
          if (cmd === 'initialize')
            return {
              devices,
              inputs,
              settings: {
                endpoint: inputs[0].id,
                latency: 300,
                buffer: 128,
                mapping: [0, 1],
                keepAwake: true,
                closeAction: 'tray',
                detailedLogs: false,
                captureDiagnostics: false,
                speakersSwapped: false,
              },
              autostart: false,
              captureEnabled: true,
              dataPath: 'UI fixture / no hardware connection',
              backendAvailable: true,
              defaultEndpoint: inputs[0].id,
            };
          if (cmd === 'discover_devices') return devices;
          if (cmd === 'start_stream') {
            emit('source-level', { endpoint: inputs[0].id, captureEnabled: true });
            const sessionId = ++id;
            const host = devices.find((d) => d.name === args.names[0]).addresses[0];
            setTimeout(() => send(sessionId, { kind: 'password_required', host }), 40);
            return sessionId;
          }
          if (cmd === 'submit_password')
            setTimeout(() => {
              if (args.password === 'bad')
                send(args.sessionId, {
                  kind: 'finished',
                  error: 'PASSWORD_REJECTED（退出码 10）：测试密码不正确',
                });
              else {
                send(args.sessionId, { kind: 'native', line: '[PROBE] PCM_READY' });
                send(args.sessionId, {
                  kind: 'telemetry',
                  elapsed_seconds: 20,
                  water_ms: 130,
                  lead_ms: 300,
                  capture_frames: 960000,
                  output_frames: 882000,
                  peaks: [0.12, 0.08],
                  controller: { correction_ppm: 25 },
                });
                send(args.sessionId, {
                  kind: 'native',
                  line: `[PROBE] PACKET_STATS host=${args.host} sent=100 send_dropped=2 sync_dropped=0 rtx_requested=3 rtx_resent=2 rtx_expired=1`,
                });
              }
            }, 40);
          if (cmd === 'stop_stream') send(id, { kind: 'finished', cancelled: true });
        },
        { shouldMockEvents: true },
      );
      import('../../../airplay-frontend/src/main.ts');
    </script>
  </body>
</html>

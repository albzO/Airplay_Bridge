[package]
name = "homepod-test"
version = "1.0.1"
edition = "2024"

[dependencies]
mdns-sd = "=0.21.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = { version = "=5.0.1", default-features = false }
audioadapter-buffers = "=5.2.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Performance", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }


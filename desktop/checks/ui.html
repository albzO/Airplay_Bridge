<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><div id="app"></div><script type="module">
import {mockIPC} from '@tauri-apps/api/mocks';
import {emit} from '@tauri-apps/api/event';
import devices from './devices.json';import inputs from './inputs.json';
let id=100,host=devices[0].addresses[0];
const send=payload=>emit('stream-event',{session_id:id,...payload});
mockIPC((cmd,args)=>{
 if(cmd==='initialize')return {devices,inputs,settings:{endpoint:inputs.find(i=>i.name.includes('B3')).id,latency:300,buffer:128,mapping:[0,1]},dataPath:'UI fixture / no hardware connection',backendAvailable:true};
 if(cmd==='discover_devices')return devices;
 if(cmd==='start_stream'){id++;host=devices.find(d=>d.name===args.names[0]).addresses[0];setTimeout(()=>send({kind:'password_required',host}),40);return id;}
 if(cmd==='submit_password')setTimeout(()=>{if(args.password==='bad')send({kind:'finished',error:'PASSWORD_REJECTED（退出码 10）：测试密码不正确'});else{send({kind:'native',line:'[PROBE] PCM_READY'});send({kind:'telemetry',elapsed_seconds:20,water_ms:130,lead_ms:300,capture_frames:960000,output_frames:882000,peaks:[.12,.08],controller:{correction_ppm:25}});send({kind:'native',line:`[PROBE] PACKET_STATS host=${host} sent=100 send_dropped=2 sync_dropped=0 rtx_requested=3 rtx_resent=2 rtx_expired=1`});}},40);
 if(cmd==='stop_stream')send({kind:'finished',cancelled:true});
},{shouldMockEvents:true});
import('/src/main.ts');
</script></body></html>
